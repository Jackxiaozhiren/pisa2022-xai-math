[project]
name = "pisa-2022-xai-math"
version = "0.1.0"
description = "Explainable machine learning workflow for PISA 2022 mathematics literacy and low-performing students."
requires-python = ">=3.9"
dependencies = [
  "pandas>=2.1",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "scipy>=1.11",
  "pyreadstat>=1.2,<1.3",
  "pyarrow>=15.0",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "shap>=0.45",
  "xgboost>=2.0",
  "lightgbm>=4.3",
  "catboost>=1.2",
  "statsmodels>=0.14",
  "PyYAML>=6.0",
  "openpyxl>=3.1",
  "tqdm>=4.66",
  "optuna>=3.6",
  "dice-ml>=0.11",
  "umap-learn>=0.5",
  "lime>=0.2"
]

# Note: requirements.txt is the canonical install file (see README); the
# [project] dependencies above mirror it so pyproject and requirements stay
# consistent for reproducibility.

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"
